<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
  <defs><clipPath id="cardClip0"><rect x="16" y="16" width="332" height="190" rx="10"/></clipPath><clipPath id="cardClip1"><rect x="16" y="16" width="332" height="190" rx="10"/></clipPath><clipPath id="cardClip2"><rect x="16" y="16" width="332" height="190" rx="10"/></clipPath></defs>
  <rect width="1200" height="270" rx="20" fill="#0b1120"/>
  <g transform="translate(28, 24)"><rect width="364" height="222" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><g clip-path="url(#cardClip0)"><rect x="24" y="24" width="44" height="6" rx="3" fill="#38bdf8"/><text x="24" y="74" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Единый код для всех платф…</text><text x="24" y="114" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Один index.html работает в</text><text x="24" y="137" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">браузере, Android и iOS через</text><text x="24" y="160" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Capacitor</text></g></g><g transform="translate(416, 24)"><rect width="364" height="222" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><g clip-path="url(#cardClip1)"><rect x="24" y="24" width="44" height="6" rx="3" fill="#818cf8"/><text x="24" y="74" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">PWA и офлайн-режим</text><text x="24" y="114" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Устанавливается как приложение и</text><text x="24" y="137" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">работает без интернета благодаря</text><text x="24" y="160" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">service worker</text></g></g><g transform="translate(804, 24)"><rect width="364" height="222" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><g clip-path="url(#cardClip2)"><rect x="24" y="24" width="44" height="6" rx="3" fill="#34d399"/><text x="24" y="74" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Синхронизация режима пита…</text><text x="24" y="114" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Выбранный режим (масса, сушка,</text><text x="24" y="137" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">поддержание) автоматически</text><text x="24" y="160" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">применяется во всех разделах</text></g></g>

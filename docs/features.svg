  <g transform="translate(28, 28)"><rect width="364" height="204" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><rect x="24" y="24" width="44" height="6" rx="3" fill="#38bdf8"/><text x="24" y="76" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">ИИ-тренер под руку</text><text x="24" y="116" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Персональные рекомендации по программе, нагрузке и в</text><text x="24" y="140" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">осстановлению — прямо в приложении.</text></g><g transform="translate(416, 28)"><rect width="364" height="204" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><rect x="24" y="24" width="44" height="6" rx="3" fill="#818cf8"/><text x="24" y="76" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Дневник тренировок и питания</text><text x="24" y="116" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Подходы, рабочий вес, калории и БЖУ: вся история про</text><text x="24" y="140" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">гресса под контролем, офлайн.</text></g><g transform="translate(804, 28)"><rect width="364" height="204" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><rect x="24" y="24" width="44" height="6" rx="3" fill="#34d399"/><text x="24" y="76" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Один код — браузер, Android </text><text x="24" y="116" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Capacitor-оболочка, готовый PWA-манифест и CI-сборка</text><text x="24" y="140" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15"> debug APK через GitHub Actions.</text></g>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
  <defs><clipPath id="cardClip0"><rect x="16" y="16" width="332" height="190" rx="10"/></clipPath><clipPath id="cardClip1"><rect x="16" y="16" width="332" height="190" rx="10"/></clipPath><clipPath id="cardClip2"><rect x="16" y="16" width="332" height="190" rx="10"/></clipPath></defs>
  <rect width="1200" height="270" rx="20" fill="#0b1120"/>
  <g transform="translate(28, 24)"><rect width="364" height="222" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><g clip-path="url(#cardClip0)"><rect x="24" y="24" width="44" height="6" rx="3" fill="#38bdf8"/><text x="24" y="74" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Подборки для каждого моду…</text><text x="24" y="114" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Готовые наборы карточек с советами</text><text x="24" y="137" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">по тренировкам, питанию,</text><text x="24" y="160" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">восстановлению и привычкам — в</text><text x="24" y="183" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">стиле Bento Grid.</text></g></g><g transform="translate(416, 24)"><rect width="364" height="222" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><g clip-path="url(#cardClip1)"><rect x="24" y="24" width="44" height="6" rx="3" fill="#818cf8"/><text x="24" y="74" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Кроссплатформенность</text><text x="24" y="114" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Один код работает в браузере, на</text><text x="24" y="137" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Android и iOS благодаря Capacitor.</text><text x="24" y="160" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">PWA-установка без сторов.</text></g></g><g transform="translate(804, 24)"><rect width="364" height="222" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><g clip-path="url(#cardClip2)"><rect x="24" y="24" width="44" height="6" rx="3" fill="#34d399"/><text x="24" y="74" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Офлайн-режим и автосборка</text><text x="24" y="114" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Service Worker кэширует оболочку,</text><text x="24" y="137" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">а GitHub Actions автоматически</text><text x="24" y="160" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">собирает debug APK при пуше в</text><text x="24" y="183" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">main.</text></g></g>
</svg>

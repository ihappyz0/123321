<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <rect width="1200" height="260" rx="20" fill="#0b1120"/>
  <g transform="translate(28, 28)"><rect width="364" height="204" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><rect x="24" y="24" width="44" height="6" rx="3" fill="#38bdf8"/><text x="24" y="76" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Режимы питания</text><text x="24" y="116" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Набор массы, похудение, сушка и поддержание формы: а</text><text x="24" y="140" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">втоматический расчёт калорий и БЖУ под вашу цель.</text></g><g transform="translate(416, 28)"><rect width="364" height="204" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><rect x="24" y="24" width="44" height="6" rx="3" fill="#818cf8"/><text x="24" y="76" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">База из 38 рецептов</text><text x="24" y="116" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Готовые блюда с калорийностью, БЖУ и пошаговыми инст</text><text x="24" y="140" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">рукциями, подобранные под выбранный режим.</text></g><g transform="translate(804, 28)"><rect width="364" height="204" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><rect x="24" y="24" width="44" height="6" rx="3" fill="#34d399"/><text x="24" y="76" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Мобильные сборки</text><text x="24" y="116" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Capacitor-оболочки для Android и iOS, установка как </text><text x="24" y="140" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">PWA и автосборка APK через GitHub Actions.</text></g>
</svg>

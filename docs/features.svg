  <g transform="translate(28, 28)"><rect width="364" height="204" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><rect x="24" y="24" width="44" height="6" rx="3" fill="#38bdf8"/><text x="24" y="76" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">🏋️ ИИ-тренер и дневник зала</text><text x="24" y="116" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Умный помощник подсказывает нагрузку, а дневник трен</text><text x="24" y="140" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">ировок хранит подходы, веса и прогресс в одном месте</text></g><g transform="translate(416, 28)"><rect width="364" height="204" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><rect x="24" y="24" width="44" height="6" rx="3" fill="#818cf8"/><text x="24" y="76" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">📱 Одно приложение — везде</text><text x="24" y="116" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Веб-версия, PWA и нативные сборки для Android и iOS </text><text x="24" y="140" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">на Capacitor: тот же код, тот же интерфейс, офлайн-р</text></g><g transform="translate(804, 28)"><rect width="364" height="204" rx="18" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)" stroke-width="1.4"/><rect x="24" y="24" width="44" height="6" rx="3" fill="#34d399"/><text x="24" y="76" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">🎬 Видео-уроки и анализ техни</text><text x="24" y="116" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Библиотека упражнений с видео и разбором техники, а </text><text x="24" y="140" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">также учёт питания — всё внутри тёмного минималистич</text></g>
